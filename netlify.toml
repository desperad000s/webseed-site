# webseed.me — Netlify configuration

[build]
  publish = "."

# Long-cache for hashable static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# HTML: browser revalidates each load, but the Netlify edge serves cached
# HTML for up to s-maxage. Drops TTFB from ~2s (origin round-trip) to
# <100ms (edge cache hit). stale-while-revalidate keeps the page snappy
# during background refresh.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=600, stale-while-revalidate=86400, durable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "public, s-maxage=600, stale-while-revalidate=86400, durable"

# Security headers across all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Block search engines from indexing staging / branch deploys / deploy previews.
# Production (webseed.me) is unaffected — Netlify only applies these in non-prod contexts.
[context.branch-deploy.headers]
  for = "/*"
  [context.branch-deploy.headers.values]
    X-Robots-Tag = "noindex, nofollow"

[context.deploy-preview.headers]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Form submissions on /contact — Netlify Forms auto-detects, no extra config needed.
# To enable: add `data-netlify="true"` to the <form> in contact.html.
